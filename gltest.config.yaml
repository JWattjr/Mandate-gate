# GenLayer test runner networks.
# Direct tests need no network. Studio Next is the only live target.
networks:
  default: localnet
  localnet:
    url: "http://127.0.0.1:4000/api"
  # The pinned gltest 0.30.0rc2 release provides Studio Next as the
  # preconfigured `studio_devnet` network (chain 61997). Direct tests stay on
  # localnet and do not make a network request.
  studio_devnet: {}
paths:
  contracts: "contracts"
environment: .env
